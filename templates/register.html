<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
</head>

<script>

function togglePassword() {

    const password = document.getElementById("password");
    const eye = document.getElementById("eye1");

    if (password.type === "password") {
        password.type = "text";
        eye.classList.replace("fa-eye", "fa-eye-slash");
    } else {
        password.type = "password";
        eye.classList.replace("fa-eye-slash", "fa-eye");
    }

}

function toggleConfirmPassword() {

    const password = document.getElementById("confirmPassword");
    const eye = document.getElementById("eye2");

    if (password.type === "password") {
        password.type = "text";
        eye.classList.replace("fa-eye", "fa-eye-slash");
    } else {
        password.type = "password";
        eye.classList.replace("fa-eye-slash", "fa-eye");
    }

}

</script>

<body>

<nav class="navbar">

    <div class="logo">
        Journey Through India
    </div>

    <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/contact">Contact</a></li>
        <li><a href="/login">Login</a></li>
        <li><a href="/register">Register</a></li>
    </ul>

</nav>

<section class="register-section">

    <div class="register-form">

        <h2>Create Account</h2>

        <p>Join us and start exploring India.</p>

        <form action="/register" method="POST">

    <input type="text"
           name="name"
           placeholder="Full Name"
           required>

    <input type="email"
           name="email"
           placeholder="Email Address"
           required>

    <div class="password-box">

    <input
        type="password"
        id="password"
        name="password"
        placeholder="Password"
        required>

    <i class="fa-solid fa-eye"
       id="eye1"
       onclick="togglePassword()"></i>

</div>

<div class="password-box">

    <input
        type="password"
        id="confirmPassword"
        name="confirm_password"
        placeholder="Confirm Password"
        required>

    <i class="fa-solid fa-eye"
       id="eye2"
       onclick="toggleConfirmPassword()"></i>

</div>

    <button type="submit">
        Register
    </button>

</form>

{% if message %}
<p style="color:red; text-align:center; margin-top:15px;">
    {{ message }}
</p>
{% endif %}
<p class="login-link">
    Already have an account?
    <a href="{{ url_for('login') }}">
        Login Here
    </a>
</p>

    </div>

    <div class="register-image">

        <img src="{{ url_for('static', filename='images/register.jpg') }}"
             alt="Register">

    </div>

</section>

<footer>

    <h3>Journey Through India</h3>
    <p>Explore • Discover • Travel</p>

</footer>

</body>

</html>
