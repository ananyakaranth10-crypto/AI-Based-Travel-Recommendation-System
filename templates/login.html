<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <title>Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
</head>

<script>
function toggleLoginPassword() {

    const password = document.getElementById("loginPassword");
    const eye = document.getElementById("loginEye");

    if (password.type === "password") {
        password.type = "text";
        eye.classList.remove("fa-eye");
        eye.classList.add("fa-eye-slash");
    } else {
        password.type = "password";
        eye.classList.remove("fa-eye-slash");
        eye.classList.add("fa-eye");
    }
}
</script>

<body>

<nav class="navbar">

    <div class="logo">
        Journey Through India
    </div>

    <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/contact">Contact</a></li>
        <li><a href="/register">Register</a></li>
    </ul>

</nav>

<section class="login-section">

    <div class="login-image">

        <img src="{{ url_for('static', filename='images/login.jpg') }}"
             alt="Login">

    </div>

    <div class="login-form">

        <h2>Welcome Back</h2>

        <p>Login to continue your journey.</p>

        <form action="/login" method="POST">
            <input type="hidden" name="next" value="{{ next }}">

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required>

            <div class="password-box">

    <input
        type="password"
        id="loginPassword"
        name="password"
        placeholder="Password"
        required>

    <i class="fa-solid fa-eye"
       id="loginEye"
       onclick="toggleLoginPassword()"></i>

</div>

            <button type="submit">
                Login
            </button>

        </form>

        {% if message %}
       <p style="color:red;
          text-align:center;
          margin-top:15px;
          font-weight:bold;">
        {{ message }}
      </p>
      {% endif %}

    <p class="register-link">
    New to Journey Through India?
    <a href="{{ url_for('register') }}">
        Create an Account
    </a>
</p>

        <p style="text-align:center; margin-top:20px;">
            Don't have an account?
            <a href="/register">Register Here</a>
        </p>

    </div>

</section>

<footer>

    <h3>Journey Through India</h3>

    <p>Explore • Discover • Travel</p>

</footer>

</body>
</html>
