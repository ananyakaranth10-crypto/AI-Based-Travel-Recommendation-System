<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        Journey Through India
    </div>

    <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/contact">Contact</a></li>
    </ul>

</nav>

<section class="contact-hero">

    <h1>Contact Us</h1>
    <p>We'd love to hear from you</p>

</section>

<section class="contact-section">

    <div class="contact-image">

        <img src="{{ url_for('static', filename='images/contact.jpg') }}"
             alt="Contact">

    </div>

    <div class="contact-form">

    <h2>Get In Touch</h2>

    {% if success %}
    <p style="background:#edf4f0; color:#3E5C4B; padding:15px; border-radius:10px; border-left:4px solid #3E5C4B; font-weight:600; margin-bottom:20px;">
        ✅ {{ success }}
    </p>
    {% endif %}

    <form action="/contact" method="POST">

        <input type="text"
               name="name"
               placeholder="Your Name"
               required>

        <input type="email"
               name="email"
               placeholder="Your Email"
               required>

        <textarea rows="6"
                  name="message"
                  placeholder="Your Message"
                  required></textarea>

        <button type="submit">
            Send Message
        </button>

    </form>

</div>

</section>

<footer>

    <h3>Journey Through India</h3>
    <p>Explore • Discover • Travel</p>

</footer>

</body>
</html>
